<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wheel of Doom</title>
    <link rel="stylesheet" href="style/main.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
</head>
<body>
    <!-- <div id="fps" style="position:absolute; left:10px; top:10px; justify-self:left; align-self:normal;">100</div> -->
    <div class="app">
        <!-- WHEEL -->
        <button id="settings-button" class="settings-button">⚙</button>
        <main id="wheel-wrapper">
            <canvas id="wheel-connections" width="640" height="640"></canvas>
            <canvas id="main-wheel-canvas" width="640" height="640"></canvas>
        </main>

        <main id="editor-wrapper">
            <!-- WHEEL ENTRIES -->
            <aside class="wheel-entries">
                <div class="wheel-entries-container">
                    <div class="wheel-entries-header">
                        <label class="entry-mode-select">
                            <input type="checkbox" id="text-mode-switch">
                            <span class="entry-mode-text"></span>
                        </label>
                        <div id="wheel-entries-count-container">
                            <div>Entries: <span id="wheel-entries-count">0</span></div>
                            <div>Weight: <span id="wheel-entries-weight">0</span></div>
                        </div>
                        <button id="shuffle-button" class="secondary-button">
                            <span class="material-icons-outlined">cached</span>
                        </button>
                    </div>
                    <textarea id="text-mode-area" class="hidden"></textarea>
                    <table id="wheel-entry-table">
                    <thead>
                        <tr>
                            <th style="width:50%">Entries</th>
                            <th style="width:15%">Weight</th>
                            <th style="width:35%">Tags</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                </div>
                <div class="tags-container">
                    <div id="tag-filters"></div>
                </div>
                <button id="spin-button" class="primary">Spin</button>
            </aside>

            <!-- WHEEL SELECTOR -->
            <div id="wheel-select-area">
                <div id="wheel-select-toolbar">
                    <button id="new-wheel-button" class="tool-button has-tooltip">
                        <span class="material-icons-outlined">add</span>
                        <div class="tooltip">Make a new wheel</div>
                    </button>
                    <button id="save-wheel-button" class="tool-button has-tooltip">
                        <span class="material-icons-outlined">save</span>
                        <div class="tooltip">Save</div>
                    </button>
                    <button id="save-as-wheel-button" class="tool-button has-tooltip">
                        <span class="material-icons-outlined">save_as</span>
                        <div class="tooltip">Save As</div>
                    </button>
                    <button id="export-button" class="tool-button has-tooltip">
                        <span class="material-icons-outlined">download</span>
                        <div class="tooltip">Export</div>
                    </button>
                    <button id="import-button" class="tool-button has-tooltip">
                        <span class="material-icons-outlined">upload</span>
                        <div class="tooltip">Import</div>
                    </button>
                </div>
                <ul id="wheel-select-browser">
                    <li class="wheel-select-folder"><div class="wheel-select-folder-text"><span class="material-icons-outlined wheel-select-dropdown">keyboard_arrow_down</span>linkedin</div><ul class="wheel-select-child-container">
                        <li class="wheel-select-wheel">_Main</li>
                        <li class="wheel-select-wheel">Adjectives</li>
                        <li class="wheel-select-folder"><div class="wheel-select-folder-text"><span class="material-icons-outlined wheel-select-dropdown">keyboard_arrow_down</span>subs</div><ul class="wheel-select-child-container">
                            <li class="wheel-select-wheel">Sub1</li>
                            <li class="wheel-select-wheel">My Wheel</li>
                        </ul></li>
                    </ul></li>
                </ul>
            </div>
        </main>
    <!-- END APP -->
    </div>

    <!-- MODALS -->

    <div id="winner-modal" class="modal hidden">
        <div class="modal-box">
            <h2>🎉 Winner!</h2>
            <div id="winner-text" style="overflow-wrap:anywhere;"></div>
            <button id="close-modal-button">Close</button>
        </div>
    </div>

    <div id="settings-modal" class="modal hidden">
        <h2>⚙ Wheel Settings</h2>

        <label>
            Wheel Color Scheme
            <select id="color-scheme-select">
                <option value="classic">Classic</option>
                <option value="cool">Cool Blue</option>
                <option value="dark">Dark Mode</option>
                <option value="warm">Warm</option>
            </select>
        </label>

        <label>
            Wheel Spin Sound
            <select id="spin-sound-select">
                <option value="metalpipe">Metal Pipe</option>
                <option value="silence">Silence</option>
            </select>
        </label>

        <label>
            Wheel Victory Sound
            <select id="win-sound-select">
                <option value="yippee">Yippee</option>
                <option value="silence">Silence</option>
            </select>
        </label>

        <div class="range-group">
            <small>Spin Strength</small>
            <span>0.5</span>
            <input id="spin-strength-slider" type="range" min="0.5" max="40" step="0.5">
            <span>40</span>
            <input id="spin-strength-number" type="number">
        </div>

        <div class="range-group">
            <small>Spin Duration (milliseconds)</small>
            <span>50</span>
            <input id="spin-duration-slider" type="range" min="50" max="60000" step="50">
            <span>60000</span>
            <input id="spin-duration-number" type="number">
        </div>

        <div class="settings-actions">
            <button id="close-settings-button" class="primary">Done</button>
        </div>
    </div>

    <div id="save-modal" class="modal hidden">
        <div class="modal-card">
            <h2>Save Wheel</h2>
            <label class="modal-label">Wheel Name</label>
            <input id="save-name-input" class="modal-input" placeholder="My Awesome Wheel">
            <div class="modal-actions">
                <button id="cancel-save-as-button" class="secondary-button">Cancel</button>
                <button id="confirm-save-as-button" class="primary-button">Save</button>
            </div>
        </div>
    </div>

    <div id="load-modal" class="modal hidden">
        <div class="modal-card">
            <h2>Load Wheel</h2>
            <div id="load-list" class="wheel-list"></div>
            <div class="modal-actions">
                <button id="close-load-button" class="secondary-button">Close</button>
            </div>
        </div>
    </div>

    <div id="card-container"></div>

    <script src="script/bundled.js"></script>
</body>
</html>
